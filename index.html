<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>안성민의 휴대폰</title>
<style>
:root { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d0f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: #000;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ===== 프레임 ===== */
  .wrap { position: relative; }
  .phone {
    width: 375px; height: 780px; background: #000;
    border-radius: 54px; position: relative; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,.8), 0 0 0 11px #1c1c1e, 0 0 0 13px #3a3a3c;
  }
  .side-btn {
    position: absolute; right: -17px; top: 190px; width: 5px; height: 90px;
    background: #3a3a3c; border-radius: 0 3px 3px 0; cursor: pointer;
  }
  .side-btn:active { background: #5a5a5e; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 34px; background: #000; border-radius: 20px; z-index: 2000;
  }

  /* ===== 상태바 ===== */
  .status {
    position: absolute; top: 0; left: 0; width: 100%; height: 54px;
    padding: 18px 30px 0 34px; display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: 600; z-index: 1999; color: #fff; transition: color .25s;
    pointer-events: none;
  }
  .phone.dark-status .status { color: #000; }
  .status .right { display: flex; gap: 6px; align-items: center; }
  .status svg { fill: currentColor; display: block; }

  /* ===== 공통 뷰 ===== */
  .view {
    position: absolute; inset: 0; background: #f2f2f7;
    transform: translateX(100%); transition: transform .38s cubic-bezier(.22,.8,.3,1), opacity .3s;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.18);
  }
  .view.open { transform: translateX(0); }
  .view.behind { transform: translateX(-28%); }
  .view.root { transform: scale(.88); opacity: 0; border-radius: 40px; pointer-events: none; box-shadow: none; }
  .view.root.open { transform: scale(1); opacity: 1; border-radius: 0; pointer-events: auto; }
  .view.root.behind { transform: translateX(-28%); opacity: 1; }
  .view.white { background: #fff; }

  .nav {
    padding: 54px 8px 6px; background: rgba(249,249,251,.94);
    border-bottom: .5px solid #d1d1d6; display: flex; align-items: center;
    min-height: 98px; position: relative; flex-shrink: 0;
  }
  .nav .title { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-weight: 600; font-size: 17px; }
  .back {
    background: none; border: none; color: #007aff; font-size: 17px;
    display: flex; align-items: center; gap: 2px; padding: 8px 6px; position: relative; z-index: 2;
  }
  .back svg { width: 12px; height: 20px; stroke: #007aff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .content { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  .content::-webkit-scrollbar { display: none; }
  .big-title { font-size: 32px; font-weight: 700; padding: 8px 18px 10px; }

  /* ===== 홈바 ===== */
  .home-bar {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 138px; height: 5px; border-radius: 3px; background: #fff;
    z-index: 1998; cursor: pointer; transition: background .25s;
  }
  .home-bar::after { content: ""; position: absolute; inset: -14px -10px; }
  .phone.dark-status .home-bar { background: #000; }

  /* ===== 잠금화면 ===== */
  #lock {
    position: absolute; inset: 0; z-index: 1500; color: #fff;
    background: linear-gradient(160deg, #1d2b64 0%, #7b4397 55%, #dc2430 130%);
    transition: transform .55s cubic-bezier(.7,0,.3,1); display: flex; flex-direction: column; align-items: center;
  }
  #lock.unlocked { transform: translateY(-105%); }
  .lock-top { margin-top: 84px; text-align: center; transition: opacity .3s, transform .3s; }
  #lockDate { font-size: 18px; font-weight: 500; opacity: .9; }
  #lockTime { font-size: 82px; font-weight: 300; letter-spacing: -2px; margin-top: -4px; }
  #lock.pad .lock-top { transform: scale(.55) translateY(-100px); opacity: 0; position: absolute; }
  .lock-hint { position: absolute; bottom: 70px; font-size: 14px; opacity: .85; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #lock.pad .lock-hint { display: none; }

  .pad-wrap {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding-top: 100px; opacity: 0; pointer-events: none; transition: opacity .3s;
    background: rgba(0,0,0,.28); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  }
  #lock.pad .pad-wrap { opacity: 1; pointer-events: auto; }
  .pad-title { font-size: 18px; font-weight: 500; margin-bottom: 26px; }
  .dots { display: flex; gap: 20px; margin-bottom: 38px; }
  .dots.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff; transition: background .12s; }
  .dot.on { background: #fff; }
  .keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 22px; }
  .key {
    width: 76px; height: 76px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.2); color: #fff; font-size: 34px; font-weight: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
    transition: background .1s;
  }
  .key small { font-size: 9px; letter-spacing: 2px; font-weight: 600; margin-top: 2px; height: 10px; }
  .key:active { background: rgba(255,255,255,.55); }
  .key.ghost { background: none; font-size: 16px; font-weight: 500; }
  .key.ghost:active { background: none; opacity: .5; }

  /* ===== 홈 화면 ===== */
  #home {
    background: linear-gradient(160deg, #1d2b64 0%, #7b4397 55%, #dc2430 130%);
    color: #fff; transform: none; box-shadow: none; z-index: 0;
    transition: transform .38s cubic-bezier(.22,.8,.3,1), filter .38s;
  }
  #home.under { transform: scale(.94); filter: brightness(.6); }
  .home-date { text-align: center; margin-top: 70px; font-size: 15px; font-weight: 500; opacity: .9; }
  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 0; padding: 24px 18px; }
  .app-grid button { background: none; border: none; color: #fff; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .app-icon {
    width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: transform .12s; overflow: hidden;
  }
  .app-grid button:active .app-icon { transform: scale(.88); }
  .app-icon svg { width: 34px; height: 34px; }
  .ic-cal { background: #fff; flex-direction: column; color: #ff3b30; }
  .ic-cal b { font-size: 10px; letter-spacing: .5px; margin-top: 7px; }
  .ic-cal span { font-size: 30px; font-weight: 300; color: #000; line-height: 1; margin-top: 1px; }
  .ic-kakao { background: #fee500; }
  .ic-photos { background: #fff; }
  .ic-notes { background: linear-gradient(#ffd60a 0 32%, #fffbe6 32%); }
  .ic-phone { background: #34c759; }
  .dock {
    margin: auto 14px 26px; padding: 14px; border-radius: 32px; display: flex; justify-content: space-around;
    background: rgba(255,255,255,.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .dock .app-icon { box-shadow: none; }
  .dock button { background: none; border: none; }

  /* ===== 캘린더 ===== */
  .cal-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; }
  .cal-title { font-size: 24px; font-weight: 700; }
  .cal-title em { color: #ff3b30; font-style: normal; }
  .cal-nav button { background: none; border: none; color: #ff3b30; font-size: 26px; padding: 0 10px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 600; color: #8e8e93; padding: 0 6px 6px; }
  .cal-days span:first-child { color: #ff3b30; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: .5px solid #d1d1d6; background: #fff; }
  .cal-cell { min-height: 76px; padding: 4px 2px; border-bottom: .5px solid #e5e5ea; border-right: .5px solid #e5e5ea; font-size: 12px; background: #fff; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell .num { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; font-weight: 500; margin: 0 0 2px 3px; }
  .cal-cell.today .num { background: #ff3b30; color: #fff; }
  .cal-cell.sun .num { color: #ff3b30; }
  .event-pill { font-size: 9px; padding: 2px 3px; margin: 1px 1px 0; border-radius: 3px; color: #fff; background: #ff3b30; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-pill.blue { background: #007aff; }
  .event-pill.green { background: #34c759; }
  .event-pill.range { position: relative; z-index: 2; text-align: center; }
  .event-pill.spacer { visibility: hidden; }

  /* ===== 카카오톡 ===== */
  .list { background: #fff; margin: 0 0 20px; }
  .chat-link { display: flex; align-items: center; width: 100%; padding: 10px 16px; border: none; background: #fff; text-align: left; }
  .chat-link:active { background: #f0f0f2; }
  .chat-avatar { width: 48px; height: 48px; border-radius: 17px; background: #e8e8ed; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 22px; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-info .name { font-weight: 600; font-size: 15px; }
  .chat-info .msg { font-size: 13px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 11px; color: #aeaeb2; align-self: flex-start; margin-top: 4px; }

  .kakao-bg { background: #b2c7d9; }
  .kakao-bg .nav { background: #b2c7d9; border-bottom: none; }
  .messages-container { padding: 6px 12px 30px; display: flex; flex-direction: column; gap: 10px; }
  .date-label { text-align: center; font-size: 11px; color: #fff; background: rgba(0,0,0,.18); width: fit-content; margin: 6px auto; padding: 3px 12px; border-radius: 12px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-start; }
  .msg-row.me { justify-content: flex-end; }
  .profile-pic { width: 38px; height: 38px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .msg-content { max-width: 70%; }
  .sender-name { font-size: 11px; color: #3a3a3c; margin-bottom: 3px; }
  .bubble-wrapper { display: flex; align-items: flex-end; gap: 4px; margin-bottom: 4px; }
  .msg-row.me .bubble-wrapper { flex-direction: row-reverse; }
  .bubble { background: #fff; padding: 8px 11px; border-radius: 4px 14px 14px 14px; font-size: 14px; line-height: 1.35; }
  .msg-row.me .bubble { background: #fee500; border-radius: 14px 4px 14px 14px; }
  .bubble-img { border-radius: 4px 14px 14px 14px; overflow: hidden; max-width: 210px; line-height: 0; }
  .bubble-img img { width: 100%; display: block; }
  .timestamp { font-size: 9px; color: #5a6b78; white-space: nowrap; }
  .input-bar { padding: 8px 12px 28px; background: #fff; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .input-bar div { flex: 1; background: #f2f2f7; border-radius: 18px; padding: 8px 12px; font-size: 13px; color: #aeaeb2; }
  .input-bar span { font-size: 20px; color: #8e8e93; }

  /* ===== 사진 ===== */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .thumb { aspect-ratio: 1; border: none; padding: 0; background-size: cover; background-position: center; position: relative; }
  .thumb:active { opacity: .7; }
  .photo-count { text-align: center; color: #8e8e93; font-size: 14px; padding: 18px 0 6px; }
  #viewer { background: #000; }
  #viewer .nav { background: rgba(28,28,30,.92); border-bottom: none; }
  #viewer .nav .title { color: #fff; font-size: 14px; }
  .viewer-img { flex: 1; background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 70px; }
  .viewer-ctrl { position: absolute; bottom: 36px; left: 0; width: 100%; display: flex; justify-content: center; gap: 70px; }
  .viewer-ctrl button { background: none; border: none; color: #0a84ff; font-size: 30px; }

  /* ===== 메모 ===== */
  .note-list { background: #fff; margin: 0 16px; border-radius: 12px; overflow: hidden; }
  .note-item { width: 100%; text-align: left; background: #fff; border: none; padding: 11px 16px; border-bottom: .5px solid #e5e5ea; display: block; }
  .note-item:last-child { border-bottom: none; }
  .note-item:active { background: #f0f0f2; }
  .note-item b { display: block; font-size: 15px; }
  .note-item p { font-size: 13px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-body { padding: 18px 20px; font-size: 17px; line-height: 1.6; }
  .note-body h3 { font-size: 24px; margin-bottom: 10px; }
  .note .nav { background: #f9f6e8; }
  #noteDetail { background: #fffdf3; }

  /* ===== 전화 ===== */
  .call-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #fff; border-bottom: .5px solid #e5e5ea; width: 100%; border-left: none; border-right: none; border-top: none; text-align: left; }
  .call-item:active { background: #f0f0f2; }
  .call-item .name { font-weight: 500; font-size: 17px; }
  .call-item .time { font-size: 13px; color: #8e8e93; }
  .call-item .sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .call-item i { color: #007aff; font-style: normal; font-size: 18px; }

  .default-ava { background: #c8ccd3 url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='15' r='7' fill='%23fff'/%3E%3Cpath d='M6 40c0-9 6-14 14-14s14 5 14 14z' fill='%23fff'/%3E%3C/svg%3E") center bottom / 100% no-repeat !important; overflow: hidden; }
  /* ===== 카톡 입력창 / 답장 ===== */
  .input-bar input { flex: 1; min-width: 0; background: #f2f2f7; border: none; outline: none; border-radius: 18px; padding: 8px 12px; font-size: 16px; font-family: inherit; user-select: text; }
  .send-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #e5e5ea; color: #fff; font-size: 17px; font-weight: 700; flex-shrink: 0; }
  .send-btn.on { background: #fee500; color: #3c1e1e; }
  .bubble.typing { display: flex; gap: 4px; padding: 12px 13px; }
  .bubble.typing i { width: 6px; height: 6px; border-radius: 50%; background: #aaa; animation: blink 1s infinite; }
  .bubble.typing i:nth-child(2) { animation-delay: .15s; }
  .bubble.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  /* 입력창 글씨는 항상 검정 (다크모드에서 흰색으로 변하는 문제 방지) */
  .input-bar input, .sf-search input { color: #000; -webkit-text-fill-color: #000; caret-color: #007aff; color-scheme: light; }
  .input-bar input::placeholder, .sf-search input::placeholder { color: #8e8e93; -webkit-text-fill-color: #8e8e93; opacity: 1; }
  /* ===== 전화 앱 ===== */
  .seg-wrap { text-align: center; padding: 10px 0 8px; background: #fff; }
  .seg { display: inline-flex; background: #e9e9ee; border-radius: 9px; padding: 2px; }
  .seg button { border: none; background: none; padding: 5px 26px; font-size: 13px; font-weight: 600; border-radius: 7px; color: #000; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .call-item .name.missed { color: #ff3b30; }
  .call-item .sub { display: flex; gap: 4px; align-items: center; }
  .call-item .sub.missed { color: #ff3b30; }
  .empty { text-align: center; color: #8e8e93; padding: 60px 0; font-size: 15px; }
  .tabbar { flex-shrink: 0; display: flex; border-top: .5px solid #d1d1d6; background: rgba(249,249,251,.96); padding: 7px 0 28px; }
  .tabbar button { flex: 1; border: none; background: none; color: #8e8e93; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabbar button svg { width: 26px; height: 26px; }
  .tabbar button.on { color: #007aff; }
  .contact-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 16px; border: none; background: #fff; text-align: left; border-bottom: .5px solid #e5e5ea; }
  .contact-row:active { background: #f0f0f2; }
  .contact-row .nm { font-size: 17px; font-weight: 500; }
  .c-ava { border-radius: 50%; background: #c7c7cc center/cover no-repeat; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contact-row .c-ava { width: 40px; height: 40px; font-size: 20px; }
  .sec-head { background: #f2f2f7; padding: 3px 16px; font-size: 13px; font-weight: 600; color: #6c6c70; }
  #contactCard { background: #f2f2f7; }
  .cc-top { text-align: center; padding: 18px 0 14px; }
  .cc-avatar { width: 110px; height: 110px; font-size: 56px; margin: 0 auto 10px; }
  .cc-name { font-size: 26px; font-weight: 600; }
  .cc-actions { display: flex; gap: 12px; justify-content: center; padding: 6px 16px 16px; }
  .cc-actions button { flex: 1; max-width: 120px; background: #fff; border: none; border-radius: 12px; padding: 10px 0; font-size: 12px; color: #007aff; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cc-actions button span { font-size: 20px; }
  .cc-box { margin: 0 16px; background: #fff; border-radius: 12px; padding: 10px 16px; }
  .cc-box small { color: #8e8e93; font-size: 12px; }
  .cc-box div { font-size: 17px; margin-top: 2px; }

  /* ===== Safari ===== */
  .ic-safari { background: linear-gradient(#6cd0ff, #0a84ff); }
  .ic-safari svg { width: 48px; height: 48px; }
  #safari { background: #fff; }
  .sf-page { flex: 1; overflow-y: auto; padding: 62px 0 0; }
  .sf-page::-webkit-scrollbar { display: none; }
  .sf-search { margin: 6px 14px 4px; height: 44px; border: 1px solid #dfe1e5; border-radius: 24px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; box-shadow: 0 1px 6px rgba(32,33,36,.16); }
  .sf-search svg { width: 20px; height: 20px; flex-shrink: 0; }
  .sf-search input { flex: 1; border: none; outline: none; font-size: 16px; background: none; user-select: text; min-width: 0; font-family: inherit; }
  .sf-search button { border: none; background: none; color: #5f6368; font-size: 15px; padding: 4px; }
  .sf-list { margin-top: 6px; }
  .sf-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 11px 16px; border: none; background: #fff; text-align: left; font-size: 16px; color: #202124; }
  .sf-item:active { background: #f1f3f4; }
  .sf-item .clock { width: 20px; height: 20px; flex-shrink: 0; }
  .sf-item .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5f2eea; }
  .sf-item .arr { color: #70757a; font-size: 18px; transform: rotate(-45deg); display: inline-block; }
  .sf-foot { text-align: center; color: #70757a; font-size: 13px; padding: 14px 0 20px; }
  .sf-bottom { flex-shrink: 0; background: rgba(249,249,251,.96); border-top: .5px solid #d1d1d6; padding: 8px 14px 26px; }
  .sf-url { height: 40px; border-radius: 12px; background: #e9e9ee; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 15px; }
  .sf-url .aa { font-size: 12px; color: #000; width: 28px; }
  .sf-url .aa small { font-size: 16px; }
  .sf-url .rl { color: #000; font-size: 17px; width: 28px; text-align: right; }
  .sf-tools { display: flex; justify-content: space-around; margin-top: 8px; }
  .sf-tools button { background: none; border: none; width: 44px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .sf-tools svg { width: 24px; height: 24px; fill: none; stroke: #007aff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sf-tools button:first-child svg { width: 12px; height: 20px; }
  .sf-tools button.dis { opacity: .35; pointer-events: none; }
  .sf-tools button.dis:nth-child(2) svg { width: 12px; height: 20px; }

<script>

  const PASSCODE = '0801';
  const $ = id => document.getElementById(id);
  const phone = $('phone');
  const DOW = ['일','월','화','수','목','금','토'];
  // 폰 안의 '오늘' 날짜는 2026년 6월 20일로 고정 (시각만 실제 시계를 따라감)
  const FIXED_DATE = { y: 2026, m: 6, d: 20 };
  function nowFixed() {
    const r = new Date();
    return new Date(FIXED_DATE.y, FIXED_DATE.m - 1, FIXED_DATE.d, r.getHours(), r.getMinutes(), r.getSeconds());
  }

  /* ---------- 시계 ---------- */
  function tick() {
    const d = nowFixed();
    const t = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
    const date = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
    $('statusTime').textContent = t;
    $('lockTime').textContent = t;
    $('lockDate').textContent = date;
    $('homeDate').textContent = date;
    $('calIconDow').textContent = DOW[d.getDay()];
    $('calIconDay').textContent = d.getDate();
  }
  tick(); setInterval(tick, 10000);

  /* ---------- 화면 이동 (스택) ---------- */
  const stack = [];
  function updateChrome() {
    const top = stack[stack.length - 1];
    phone.classList.toggle('dark-status', !!(top && top.dataset.dark));
    $('home').classList.toggle('under', stack.length > 0);
  }
  function openView(id) {
    const el = $(id);
    if (!el || stack.includes(el)) return;
    const prev = stack[stack.length - 1];
    if (prev) prev.classList.add('behind');
    el.classList.add('open');
    stack.push(el);
    updateChrome();
    // 채팅방은 열 때 맨 아래(최신 메시지)로 스크롤
    if (el.classList.contains('kakao-bg')) {
      const sc = el.querySelector('.content');
      if (sc) setTimeout(() => { sc.scrollTop = sc.scrollHeight; }, 0);
    }
  }
  function goBack() {
    if (!stack.length) return;
    const el = stack.pop();
    el.classList.remove('open');
    const prev = stack[stack.length - 1];
    if (prev) prev.classList.remove('behind');
    updateChrome();
  }
  function goHome() {
    if (!$('lock').classList.contains('unlocked')) { openPad(); return; }
    if ($('callOverlay').classList.contains('show')) return;
    while (stack.length) {
      const el = stack.pop();
      el.classList.remove('open', 'behind');
    }
    updateChrome();
  }
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', goBack));

  /* ---------- 잠금화면 ---------- */
  let entered = '';
  function lockPhone() {
    endCall();
    while (stack.length) stack.pop().classList.remove('open', 'behind');
    updateChrome();
    entered = ''; renderDots();
    $('lock').classList.remove('pad');
    $('lock').classList.remove('unlocked');
    phone.classList.remove('dark-status');
  }
  function openPad() { $('lock').classList.add('pad'); $('padTitle').textContent = '암호 입력'; }
  function closePad() { entered = ''; renderDots(); $('lock').classList.remove('pad'); }
  $('lock').addEventListener('click', e => {
    if (!$('lock').classList.contains('pad') && !e.target.closest('.pad-wrap')) openPad();
  });
  function renderDots() {
    document.querySelectorAll('#dots .dot').forEach((d, i) => d.classList.toggle('on', i < entered.length));
  }
  function pressKey(k) {
    if (entered.length >= 4) return;
    entered += k; renderDots();
    if (entered.length === 4) {
      setTimeout(() => {
        if (entered === PASSCODE) {
          $('lock').classList.add('unlocked');
          setTimeout(() => { $('lock').classList.remove('pad'); entered = ''; renderDots(); }, 600);
        } else {
          $('dots').classList.add('shake');

  const rangeEvents = [

  ];
  const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

  // 과외 일정: 2/28(토)에 시작 → 이후 매주 월요일, 6월 말까지
  // 5/18(월)은 쉬고 5/19(화)에 진행
  (function addLessons() {
    const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const add = key => { (eventsData[key] = eventsData[key] || []).push({ title: '과외', color: 'red' }); };
    const SKIP = ['2026-05-18'];      // 과외 없는 날
    const EXTRA = ['2026-05-19'];     // 대신 진행하는 날
    add('2026-02-28');
    for (let d = new Date(2026, 2, 2); d <= new Date(2026, 5, 30); d.setDate(d.getDate() + 7)) {
      const k = keyOf(d);
      if (!SKIP.includes(k)) add(k);
    }
    EXTRA.forEach(add);
  })();

  function renderCalendar() {
    $('calMonthTitle').innerHTML = `${currentMonth}월 <em>${currentYear}</em>`;
    const grid = $('calGrid');
    grid.innerHTML = '';
    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    const lastDate = new Date(currentYear, currentMonth, 0).getDate();
    const now = nowFixed();
    for (let i = 0; i < firstDay; i++) {
      const c = document.createElement('div'); c.className = 'cal-cell'; grid.appendChild(c);
    }
    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement('div');
      const dow = (firstDay + date - 1) % 7;
      cell.className = 'cal-cell' + (dow === 0 ? ' sun' : '');
      if (now.getFullYear() === currentYear && now.getMonth() + 1 === currentMonth && now.getDate() === date) cell.classList.add('today');
      cell.innerHTML = `<span class="num">${date}</span>`;
      const key = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      // 여러 날 일정: 시작일(또는 주 첫째 칸)에서 이어지는 칸 수만큼 길게 그리고, 나머지 칸은 빈 자리만 확보
      const cur = new Date(currentYear, currentMonth - 1, date);
      rangeEvents.forEach(r => {
        const s = parseDate(r.start), e = parseDate(r.end);
        if (cur < s || cur > e) return;
        const bar = document.createElement('div');
        if (cur.getTime() === s.getTime() || dow === 0) {
          const span = Math.min(Math.round((e - cur) / 86400000) + 1, 7 - dow);
          bar.className = `event-pill range ${r.color}`;
          bar.textContent = r.title;
          bar.style.width = `calc(${span * 100}% + ${(span - 1) * 4.5}px - 2px)`;
        } else {
          bar.className = 'event-pill spacer';
          bar.textContent = '·';
        }
        cell.appendChild(bar);
      });
      (eventsData[key] || []).forEach(ev => {
        const pill = document.createElement('div');
        pill.className = `event-pill ${ev.color}`;
        pill.textContent = ev.title;
        cell.appendChild(pill);
      });
      grid.appendChild(cell);
    }
  }

  let photoIdx = 0;
  function renderPhotos() {
    const g = $('photoGrid');
    g.innerHTML = '';
    photos.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'thumb';
      b.style.backgroundImage = p.src;
      b.onclick = () => showPhoto(i, true);
      g.appendChild(b);
    });
    $('photoCount').textContent = `사진 ${photos.length}장`;
  }
  function showPhoto(i, open) {
    photoIdx = (i + photos.length) % photos.length;
    $('viewerImg').style.backgroundImage = photos[photoIdx].src;
    $('viewerTitle').textContent = photos[photoIdx].label;
    if (open) openView('viewer');
  }
  function stepPhoto(d) { showPhoto(photoIdx + d, false); }

  function renderChat(containerId, data, avatar, name) {
    const box = $(containerId);
    box.innerHTML = '';
    let i = 0;
    while (i < data.length) {
      const date = data[i][0];
      // 날짜 라벨
      const [y, m, d] = date.split('-').map(Number);
      const label = document.createElement('p');
      label.className = 'date-label';
      label.textContent = `${y}년 ${m}월 ${d}일 ${DOW[new Date(y, m - 1, d).getDay()]}요일`;
      box.appendChild(label);
      // 같은 날짜 안에서 같은 사람이 연속으로 보낸 메시지는 한 묶음으로
      while (i < data.length && data[i][0] === date) {
        const who = data[i][1];
        let j = i;
        while (j < data.length && data[j][0] === date && data[j][1] === who) j++;
        const row = document.createElement('div');
        row.className = 'msg-row' + (who === 'me' ? ' me' : '');
        const content = document.createElement('div');
        content.className = 'msg-content';
        if (who !== 'me') {
          const pic = document.createElement('div');
          pic.className = 'profile-pic';
          if (avatar.startsWith('data:') || avatar.startsWith('images/')) {
            pic.style.backgroundImage = `url("${avatar}")`;   // 사진 프로필
            pic.style.backgroundSize = 'cover';
            pic.style.backgroundPosition = 'center';
          } else {
            pic.textContent = avatar;
            if (!avatar) pic.style.background = '#000';       // 프로필 사진 없음 = 검정 화면
          }
          row.appendChild(pic);
          const sn = document.createElement('div');
          sn.className = 'sender-name';
          sn.textContent = name;
          content.appendChild(sn);
        }
        for (let k = i; k < j; k++) {
          const w = document.createElement('div');
          w.className = 'bubble-wrapper';
          const b = document.createElement('div');
          if (data[k][2].startsWith('img:')) {          // 'img:' + 사진 주소 = 사진 말풍선
            b.className = 'bubble-img';
            const im = document.createElement('img');
            im.src = data[k][2].slice(4);
            b.appendChild(im);
          } else {
            b.className = 'bubble';
            b.textContent = data[k][2];
          }
          w.appendChild(b);
          content.appendChild(w);
        }
        row.appendChild(content);
        box.appendChild(row);
        i = j;
      }
    }
  }
  renderChat('junmoMsgs', junmoChat, '', '과외쌤');

        { words: ['블탕'],     reply: ['블탕…? 블루베리 탕후루…?', '사줄까?'] }
      ]
    },
    junmo: {
      box: 'junmoMsgs', avatar: '', name: '과외쌤',
      rules: [
        { words: ['정모'],                               reply: ['정모는 갑자기 왜?'] },    // 정모형 / 정모 / 구정모 모두 포함
        { words: ['블탕'],                               reply: ['블…탕???', '블랙탕수육?'] },
        { words: ['공부하기싫어', '과외하기싫어'],       reply: ['그래도 해야지…'] },
        { words: ['수능대신'],                           reply: ['그건 안 돼…'] }
      ]
    },
    mom: {
      box: 'momMsgs', avatar: '__default__', name: '엄마',
      rules: [
        { words: ['돈'],                                                    reply: ['용돈 더 입금 했어'] },
        { words: ['정모', '구정모'],                                        reply: ['응?', '아 너 중학생 때 알던 형?', '그 형은 왜?'] },
        { words: ['과외', '구준모', '준모', '쌤', '선생님'],                reply: ['과외 중?'] }
      ]
    }
  };
  function makeProfile(avatar) {
    const pic = document.createElement('div');
    pic.className = 'profile-pic';
    if (avatar === '__default__') pic.classList.add('default-ava');
    else if (avatar.startsWith('data:') || avatar.startsWith('images/')) {
      pic.style.backgroundImage = `url("${avatar}")`; pic.style.backgroundSize = 'cover'; pic.style.backgroundPosition = 'center';
    } else if (!avatar) pic.style.background = '#000';
    else pic.textContent = avatar;
    return pic;
  }
  function scrollChat(room) {
    const sc = $(room.box).closest('.content');
    sc.scrollTop = sc.scrollHeight;
  }
  // 같은 사람이 이어서 보내면 한 묶음으로, 아니면 새 줄로. node = 말풍선 안에 넣을 내용 DOM
  function addBubble(roomId, who, text, typing) {
    const room = CHAT_ROOMS[roomId], box = $(room.box);
    // 오늘 날짜 구분선 (처음 한 번)
    if (!box.dataset.today) {
      box.dataset.today = '1';
      const t = nowFixed(), label = document.createElement('p');
      label.className = 'date-label';
      label.textContent = `${t.getFullYear()}년 ${t.getMonth() + 1}월 ${t.getDate()}일 ${DOW[t.getDay()]}요일`;
      box.appendChild(label);
    }
    let row = box.lastElementChild;
    const wantMe = who === 'me';
    if (!row || !row.classList.contains('msg-row') || row.classList.contains('me') !== wantMe) {
      row = document.createElement('div');
      row.className = 'msg-row' + (wantMe ? ' me' : '');
      const content = document.createElement('div'); content.className = 'msg-content';
      if (!wantMe) {
        row.appendChild(makeProfile(room.avatar));
        const sn = document.createElement('div'); sn.className = 'sender-name'; sn.textContent = room.name;
        content.appendChild(sn);
      }
      row.appendChild(content);
      box.appendChild(row);
    }
    const w = document.createElement('div'); w.className = 'bubble-wrapper';
    const b = document.createElement('div');
    if (typing) { b.className = 'bubble typing'; b.innerHTML = '<i></i><i></i><i></i>'; }
    else { b.className = 'bubble'; b.textContent = text; }
    w.appendChild(b);
    row.querySelector('.msg-content').appendChild(w);
    scrollChat(room);
    return w;
  }
  function updateChatList(roomId, text) {
    const row = $('row_' + roomId);
    row.querySelector('.msg').textContent = text;
    const t = nowFixed(), h = t.getHours();
    row.querySelector('.chat-time').textContent = `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(t.getMinutes()).padStart(2, '0')}`;
    row.parentNode.insertBefore(row, row.parentNode.firstChild);   // 가장 최근 대화가 맨 위로
  }
  const replyTimers = {};
  function findReply(room, text) {
    const n = text.replace(/\s+/g, '');
    const rule = room.rules.find(r => r.words.some(w => n.includes(w)));
    return rule ? rule.reply : null;
  }
  function sendChat(roomId) {
    const input = $(roomId + 'Input'), text = input.value.trim();
    if (!text) return;
    input.value = ''; input.dispatchEvent(new Event('input'));
    addBubble(roomId, 'me', text);
    updateChatList(roomId, text);
    const lines = findReply(CHAT_ROOMS[roomId], text);
    if (!lines) return;                       // 정해둔 단어가 없으면 답장 없음
    let t = 700;
    lines.forEach(line => {
      const typingAt = t;
      (replyTimers[roomId] = replyTimers[roomId] || []).push(setTimeout(() => {
        const dots = addBubble(roomId, 'other', '', true);
        replyTimers[roomId].push(setTimeout(() => {
          dots.remove();
          addBubble(roomId, 'other', line);
          updateChatList(roomId, line);
        }, 500 + line.length * 70));
      }, typingAt));
      t += 700 + 500 + line.length * 70;
    });
  }
  document.querySelectorAll('form.input-bar').forEach(f => {
    const id = f.dataset.room, input = f.querySelector('input'), btn = f.querySelector('.send-btn');
    input.addEventListener('input', () => btn.classList.toggle('on', input.value.trim() !== ''));
    f.addEventListener('submit', e => { e.preventDefault(); sendChat(id); });
  });

  /* ---------- 전화 앱: 연락처 + 통화 기록 ---------- */
  const CONTACTS = {
    junmo:  { name: '과외쌤',  sort: 'ㄱ', avatar: { def: true }, chat: 'junmo'  },
    mom:    { name: '엄마',    sort: 'ㅇ', avatar: { def: true }, chat: 'mom'    },
    jungmo: { name: '정모 형', sort: 'ㅈ', avatar: { def: true }, chat: 'jungmo' }
  };
  const contactByName = n => Object.values(CONTACTS).find(c => c.name === n);
  function paintAvatar(el, a) {
    el.style.backgroundImage = 'none'; el.style.background = ''; el.textContent = ''; el.classList.remove('default-ava');
    if (a.def) { el.classList.add('default-ava'); return; }
    if (a.photo) { el.style.backgroundImage = `url("${a.photo}")`; }
    else if (a.black) { el.style.background = '#000'; }
    else if (a.emoji) { el.textContent = a.emoji; }
  }

  // 통화 기록 — [날짜, 24시간제 시각, 종류(out 발신 / in 수신 / missed 부재중), 연락처]  ※ 기준일 2026-06-20
  const callLogData = [
    ['2026-06-20', '11:42', 'missed', 'mom'],
    ['2026-06-20', '09:15', 'in',     'jungmo'],
    ['2026-06-19', '20:03', 'out',    'mom'],
    ['2026-06-18', '18:20', 'in',     'mom'],
    ['2026-06-17', '16:48', 'missed', 'junmo'],
    ['2026-06-16', '21:10', 'out',    'jungmo'],
    ['2026-06-15', '17:02', 'in',     'junmo'],
    ['2026-06-13', '14:31', 'missed', 'jungmo'],
    ['2026-06-12', '19:40', 'out',    'mom'],
    ['2026-06-10', '15:25', 'out',    'junmo'],
    ['2026-06-09', '22:12', 'in',     'jungmo'],
    ['2026-06-08', '16:55', 'missed', 'junmo'],
    ['2026-06-05', '18:30', 'in',     'mom'],
    ['2026-06-03', '08:20', 'missed', 'jungmo'],
    ['2026-06-02', '13:08', 'in',     'junmo']
  ];
  const typeText = { out: '↗ 발신 전화', in: '↙ 수신 전화', missed: '↙ 부재중 전화' };
  function fmtTime(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2, '0')}`;
  }
  function fmtWhen(date, hhmm) {
    const today = `${FIXED_DATE.y}-${String(FIXED_DATE.m).padStart(2, '0')}-${String(FIXED_DATE.d).padStart(2, '0')}`;
    const yest = `${FIXED_DATE.y}-${String(FIXED_DATE.m).padStart(2, '0')}-${String(FIXED_DATE.d - 1).padStart(2, '0')}`;
    if (date === today) return fmtTime(hhmm);
    if (date === yest) return '어제';
    const [, m, d] = date.split('-').map(Number);
    return `${m}월 ${d}일`;
  }
  let logFilter = 'all';
  function renderCallLog() {
    const box = $('callLog'); box.innerHTML = '';
    const rows = callLogData.filter(r => logFilter === 'all' || r[2] === 'missed');
    if (!rows.length) { box.innerHTML = '<div class="empty">부재중 전화가 없습니다</div>'; return; }
    rows.forEach(([date, time, type, id]) => {
      const c = CONTACTS[id];
      const b = document.createElement('button');
      b.className = 'call-item';
      b.innerHTML = `<div><div class="name${type === 'missed' ? ' missed' : ''}"></div><div class="sub${type === 'missed' ? ' missed' : ''}">${typeText[type]}</div></div>` +
                    `<div style="display:flex;gap:10px;align-items:center"><span class="time">${fmtWhen(date, time)}</span><i>ⓘ</i></div>`;
      b.querySelector('.name').textContent = c.name;
      b.onclick = e => { if (e.target.closest('i')) openContact(id); else startCall(c.name); };
      box.appendChild(b);
    });
  }
  function renderContacts() {
    const box = $('contactList'); box.innerHTML = '';
    const list = Object.entries(CONTACTS).sort((a, b) => a[1].name.localeCompare(b[1].name, 'ko'));
    let last = '';
    list.forEach(([id, c]) => {
      if (c.sort !== last) { const h = document.createElement('div'); h.className = 'sec-head'; h.textContent = c.sort; box.appendChild(h); last = c.sort; }
      const b = document.createElement('button');
      b.className = 'contact-row';
      b.innerHTML = '<div class="c-ava"></div><div class="nm"></div>';
      paintAvatar(b.querySelector('.c-ava'), c.avatar);
      b.querySelector('.nm').textContent = c.name;
      b.onclick = () => openContact(id);
      box.appendChild(b);
    });
    $('contactCount').textContent = `연락처 ${list.length}명`;
  }
  let ccId = null;
  function openContact(id) {
    ccId = id;
    const c = CONTACTS[id];
    const av = $('ccAvatar'); av.className = 'c-ava cc-avatar'; paintAvatar(av, c.avatar);
    $('ccName').textContent = c.name;
    openView('contactCard');
  }
  function ccCall() { startCall(CONTACTS[ccId].name); }
  function ccMessage() { openView(CONTACTS[ccId].chat); }
  function setCallAvatar(name) {
    const c = contactByName(name), av = document.querySelector('.call-header .avatar');
    av.style.backgroundSize = 'cover'; av.style.backgroundPosition = 'center';
    paintAvatar(av, c ? c.avatar : { emoji: '👤' });
    if (!c) av.style.background = 'rgba(255,255,255,.15)';
    else if (!c.avatar.photo && !c.avatar.black) av.style.background = 'rgba(255,255,255,.15)';
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    logFilter = b.dataset.f;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    renderCallLog();
  }));
  document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.tab;
    document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
    $('tabRecents').style.display = t === 'recents' ? '' : 'none';
    $('tabContacts').style.display = t === 'contacts' ? '' : 'none';
    $('phoneTitle').textContent = t === 'recents' ? '최근 통화' : '연락처';
  }));
  renderCallLog(); renderContacts();

  /* ---------- Safari: 검색 기록 ---------- */
  // 위에서부터 보이는 순서대로 적혀 있습니다. 줄을 추가/삭제/순서 변경하면 그대로 반영돼요.
  const SEARCH_HISTORY = [
    '6모 등급컷',
    '모의고사 등급표',
    '얼굴 똑같은 사람',
    '도플갱어',
    'XX사립 고등학교',
    '서울대 인트라넷'
  ];
  const CLOCK_SVG = '<svg class="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#70757a" stroke-width="2"/><path d="M12 7v5l3.500 2" fill="none" stroke="#70757a" stroke-width="2" stroke-linecap="round"/></svg>';
  function renderSearchHistory() {
    const q = $('sfInput').value.trim();
    const box = $('sfList'); box.innerHTML = '';
    SEARCH_HISTORY.filter(t => !q || t.includes(q)).forEach(t => {
      const b = document.createElement('button');
      b.className = 'sf-item';
      b.innerHTML = CLOCK_SVG + '<span class="txt"></span><span class="arr">↑</span>';
      b.querySelector('.txt').textContent = t;
      b.onclick = () => { $('sfInput').value = t; renderSearchHistory(); };
      box.appendChild(b);
    });
    $('sfClear').style.visibility = q ? 'visible' : 'hidden';
  }
  $('sfInput').addEventListener('input', renderSearchHistory);
  $('sfClear').addEventListener('click', () => { $('sfInput').value = ''; renderSearchHistory(); });
  renderSearchHistory();

  /* ---------- 통화 ---------- */
  let callInterval, callStart, captionTimeouts = [], seconds = 0;
  // 통화 대사: 사람마다 여러 가지 중 하나가 무작위로 나옵니다 (직전과 같은 건 피함).
  // 한 묶음 = 통화 한 번에 순서대로 나오는 자막입니다. 묶음을 추가/수정하면 바로 반영돼요.
  const scriptData = {
    '정모 형': [
      ['성민이 왜?', '형 지금 공부 중이지', '성민이도 스카 올래?'],
      ['응 성민아', '어디쯤이야?', '응 알았어'],
      ['성민아~ 형 보고 싶어서 전화했어?', '…미안', '응! 이따 봐~!'],
      ['여보세요?', '모르는 문제? 음…', '카톡 보내줘!']
    ],
    '과외쌤': [
      ['여보세요?', '아 성민아.', '늦는다고? 알았어. 천천히 와.'],
      ['여보세요?', '쌤 지금 도착 했지.', '응 알겠어.'],
      ['응, 성민아.', '…후추 간식 안 줬어.', '진짜? 알겠어!']
    ],
    '엄마': [
      ['어~ 아들?', '밥은?', '배달만 먹지 말고!', '생활비 보냈으니까 확인해.']
    ]
  };
  const lastPick = {};
  function pickScript(name) {
    const list = scriptData[name];
    if (!list) return ['통화에 연결되었습니다.'];
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastPick[name]) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    lastPick[name] = i;
    return list[i];
  }
  function showCaption(text) {
    const el = $('captionText');
    el.textContent = text;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  function startCall(name) {
    endCall();
    $('callTargetName').textContent = name;
    setCallAvatar(name);
    $('callTimer').textContent = '연결 중...';
    $('captionText').textContent = '...';
    $('callOverlay').classList.add('show');
    phone.classList.remove('dark-status');
    seconds = 0;
    captionTimeouts.push(setTimeout(() => {
      $('callTimer').textContent = '00:00';
      callInterval = setInterval(() => {
        seconds++;
        $('callTimer').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }, 1000);
      let t = 900;                       // 연결 후 첫 자막까지
      pickScript(name).forEach(line => {
        captionTimeouts.push(setTimeout(() => showCaption(line), t));
        t += 2200 + line.length * 90;    // 글자 수에 따라 다음 자막까지 시간
      });
      // 마지막 자막이 끝나면 '통화 종료' 표시 후 자동으로 홈 화면으로
      captionTimeouts.push(setTimeout(() => { $('callTimer').textContent = '통화 종료'; clearInterval(callInterval); }, t));
      captionTimeouts.push(setTimeout(hangUp, t + 1300));
    }, 1200));
  }
  // 통화를 끊고(자동/수동 모두) 홈 화면으로 돌아감
  function hangUp() { endCall(); goHome(); }
  function endCall() {
    clearInterval(callInterval);
    captionTimeouts.forEach(clearTimeout);
    captionTimeouts = [];
    $('callOverlay').classList.remove('show');
    updateChrome();
  }

  /* 화면이 작으면 폰 전체를 줄여서 가로 스크롤 없이 한 화면에 맞춤 */
  function fitPhone() {
    const wrap = document.querySelector('.wrap');
    const s = Math.min(1, window.innerWidth / 440, window.innerHeight / 850);
    wrap.style.zoom = s > 0.2 ? s : 1;
  }
  fitPhone(); window.addEventListener('resize', fitPhone);
</script>

</body></html>
